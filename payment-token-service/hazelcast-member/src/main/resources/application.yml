spring:
  application:
    name: hazelcast-member
  config:
    import: "classpath:config/pts-defaults.yml"
  datasource:
    url: "jdbc:h2:file:./target/pts-local;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      # The MapLoader and MapStore run on partition threads; size the pool for them.
      maximum-pool-size: 30
      pool-name: hz-member-pool
  sql:
    init:
      mode: always
      schema-locations: "classpath:db/h2/schema.sql"

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

pts:
  bins:
    seed-on-startup: false
  hazelcast:
    mode: MEMBER
    cluster-name: pts-cluster
    port: 5701
    members:
      - "127.0.0.1:5701"
      - "127.0.0.1:5702"
    vault-ttl-seconds: 300
    write-behind-seconds: 1
    backup-count: 1

---
# Second member of the local two-member cluster: run with --spring.profiles.active=member2
spring:
  config:
    activate:
      on-profile: member2
server:
  port: 8091
pts:
  hazelcast:
    port: 5702
