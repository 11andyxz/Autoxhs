# Load balancer for the two detokenization replicas (S10.4).
#
# The failover demo depends on the settings below, not on nginx defaults:
#   * max_fails/fail_timeout  -- how fast a killed replica is taken out of rotation. Left at the
#     default it would keep receiving traffic for far longer than the demo, and the "throughput
#     continues" claim would look false.
#   * proxy_next_upstream     -- retry the OTHER replica when one dies mid-request, so a kill
#     produces at most a few slow requests rather than errors.
#   * proxy_read_timeout      -- inside the latency budget. A hung replica must fail fast; holding
#     the connection would convert one bad replica into a stalled switch.
upstream detok {
    server detokenization-service-1:8082 max_fails=1 fail_timeout=2s;
    server detokenization-service-2:8082 max_fails=1 fail_timeout=2s;
    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://detok;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Propagate the trace id so one authorization stays greppable across the LB (S13).
        proxy_set_header X-Trace-Id $http_x_trace_id;

        proxy_connect_timeout 500ms;
        proxy_send_timeout    2s;
        proxy_read_timeout    2s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
