spring:
  application:
    name: token-controls-service
  config:
    import: "classpath:config/pts-defaults.yml"
  datasource:
    # Shared H2 file database for the pure-JVM local stack. The Docker Compose stack overrides this
    # to Oracle Free 23 through Toxiproxy (see docker-compose.yml).
    url: "jdbc:h2:file:./target/pts-local;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      pool-name: controls-pool
  sql:
    init:
      mode: always
      schema-locations: "classpath:db/h2/schema.sql"
      continue-on-error: false

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        pts.controls.check: true

pts:
  # This service never allocates tokens, so it does not need to seed reference data.
  bins:
    seed-on-startup: false
