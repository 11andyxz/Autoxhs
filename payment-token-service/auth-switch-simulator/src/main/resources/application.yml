spring:
  application:
    name: auth-switch-simulator
  config:
    import: "classpath:config/pts-defaults.yml"
  datasource:
    url: "jdbc:h2:file:./target/pts-local;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 15
      pool-name: switch-pool
  sql:
    init:
      mode: always
      schema-locations: "classpath:db/h2/schema.sql"

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        pts.switch.authorization: true

pts:
  bins:
    seed-on-startup: false

auth-switch:
  iso-port: 8583
  detokenize-url: "http://localhost:8082"
  issuer-sim-url: "http://localhost:8085"
  socket-timeout-millis: 30000
  min-threads: 4
  max-threads: 128
  record-forwarded-messages: true

---
spring:
  config:
    activate:
      on-profile: compose
  datasource:
    url: "jdbc:oracle:thin:@//toxiproxy:21521/FREEPDB1"
    username: pts
    password: pts
    driver-class-name: oracle.jdbc.OracleDriver
  sql:
    init:
      mode: never
auth-switch:
  # nginx load-balances the two detokenization replicas (S10.4)
  detokenize-url: "http://detok-lb"
  issuer-sim-url: "http://issuer-simulator:8085"
